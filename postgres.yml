apiVersion: v1
kind: Secret
metadata:
  name: hamilton-postgres-secret
  namespace: hamilton
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "12345"
  POSTGRES_DB: "hamilton_finance"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hamilton-postgres-init
  namespace: hamilton
data:
  01-schema.sql: |
    CREATE SCHEMA IF NOT EXISTS hamilton;

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hamilton-postgres
  namespace: hamilton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hamilton-postgres

  template:
    metadata:
      labels:
        app: hamilton-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: hamilton-postgres-secret

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

            - name: init
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command: ["pg_isready","-U","postgres"]

            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: data
          emptyDir: {}

        - name: init
          configMap:
            name: hamilton-postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: hamilton-postgres
  namespace: hamilton

spec:
  selector:
    app: hamilton-postgres

  ports:
    - port: 5432
      targetPort: 5432